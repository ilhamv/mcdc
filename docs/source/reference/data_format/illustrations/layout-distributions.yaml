# Reusable Distribution layout illustrations.
# Units shown after the shape are stored as dataset attributes.

# ======================================================================================
# One continuous distribution
# ======================================================================================

distribution/:
  '@type': table
  value: float [K], eV
  pdf: float [K], 1/eV
  interpolation/:
    laws: string [R]
    boundaries: integer [R]  # Exclusive upper-point indices

# ======================================================================================
# Distributions indexed by another grid
# ======================================================================================

energy-distribution/:
  '@type': multi-table
  grid: float [I], eV  # One indexing coordinate per table
  interpolation/:
    laws: string [G]  # Interpolation between neighboring grid tables
    boundaries: integer [G]

  tables/:
    offsets: integer [I + 1]  # Starts at zero and ends at P
    value: float [P], eV
    pdf: float [P], 1/eV
    interpolation/:
      offsets: integer [I + 1]  # Starts at zero and ends at R
      laws: string [R]
      boundaries: integer [R]  # Relative to each individual table

# ======================================================================================
# Joint energy-angle distributions
# ======================================================================================

energy-angle-distribution/:
  '@type': energy-angle-table
  energy: float [I], eV

  tables/:
    outgoing-energy/:
      offsets: integer [I + 1]  # One outgoing-energy table per incident energy
      value: float [P], eV
      pdf: float [P], 1/eV
      interpolation/:
        offsets: integer [I + 1]
        laws: string [R]
        boundaries: integer [R]

    cosine-distributions/:
      offsets: integer [P + 1]  # One cosine table per outgoing-energy point
      value: float [A]  # Dimensionless cosine coordinates
      pdf: float [A]
      interpolation/:
        offsets: integer [P + 1]
        laws: string [S]
        boundaries: integer [S]
