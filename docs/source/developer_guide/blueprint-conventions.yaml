# Shared documentation for the proposed MC/DC HDF5 blueprints.
# This file describes the blueprints; it is not an HDF5 file layout.

# ======================================================================================
# Blueprint conventions
# ======================================================================================

conventions:
  groups: Names ending in / are HDF5 groups.
  attributes: Names beginning with @ describe HDF5 attributes.
  fields: Values specify type, shape and units; descriptions use inline YAML comments.
  shapes: Brackets denote array dimensions; other numerical fields are scalar.
  units: Physical quantities carry a unit attribute; dimensionless quantities use 1, and polynomial coefficients carry one unit per coefficient.
  reusable-types: CrossProduct, CrossSection, Data, Distribution and Interpolation are defined in this file.
  placeholders: Names such as {i} and {j} are placeholders, not literal names or integer fields.
  indices: Indexed entries use zero-based numeric string names
  projectiles: Projectile groups reside under projectiles/; use neutron/, proton/, electron/, or an ion identifier such as Si32/.
  targets: The filename identifies the target element or nuclide; the group under projectiles/ identifies the incident projectile.
  projectile-data: Each projectile group contains its applicable xs-energy-grid, reactions and transport data such as stopping-power.
  shared-grid: CrossSection references xs-energy-grid in its containing projectile group.
  format-name: Root attribute @format is mcdc-data in every file type.
  format-version: Root attribute @format-version is a string in major.minor.patch form; the draft starts at 0.1.0.
  versioning: Major versions mark breaking changes; minor versions add backward-compatible features; patch versions correct the specification without changing compatibility.
  compatibility: Check format and format-version before reading data; report unsupported formats or versions explicitly.
  version-scope: Format version is independent of MC/DC software releases and data-library releases.

# ======================================================================================
# Transport categories
# ======================================================================================

transport categories:
  elastic-scattering: Elastic scattering, with projectile-specific kinematics.
  capture: Capture interaction, with secondary production described by cross-products.
  inelastic-scattering: Non-fission same-species secondary production, with projectile-specific kinematics.
  fission: Fission interaction, including eigenvalue and fission-tally handling.
  excitation: Electron energy loss to atomic excitation.
  bremsstrahlung: Electron energy loss through photon emission.
  ionization: Electron-impact ionization, including knock-on electron production.
  coherent-scattering: Coherent photon scattering.
  incoherent-scattering: Incoherent photon scattering.
  photoelectric: Photoelectric photon absorption.
  pair-production: Photon conversion into an electron-positron pair.

# ======================================================================================
# Cross-species products
# ======================================================================================

CrossProduct:
  particle: string  # neutron, photon, electron, positron, proton, etc.
  yield: Data, particles per reaction  # Average count, nonnegative, may be below or above one
  decay-rate: float, 1/s  # Positive finite rate for exponential delay, positive infinity for prompt
  angle-energy-distribution: Distribution  # Joint outgoing energy and direction sampling

# ======================================================================================
# Cross sections
# ======================================================================================

CrossSection:
  offset: integer  # Zero-based starting index in the shared grid
  value: float [N - offset], barn
  interpolation: Interpolation

# ======================================================================================
# Data
# ======================================================================================

Data:
  constant:
    '@type': constant
    value: float

  tabulated:
    '@type': tabulated
    grid: float [K]
    value: float [K]
    interpolation: Interpolation

  polynomial:
    '@type': polynomial
    coefficient: float [L]  # Ascending powers of the input

# ======================================================================================
# Distributions
# ======================================================================================

Distribution:
  independent-angle-energy:
    '@type': independent-angle-energy
    angular-cosine-distribution: Distribution, cosine
    energy-distribution: Distribution, eV

  elastic-angle-energy:
    '@type': elastic-angle-energy
    angular-cosine-distribution: Distribution, cosine

  mixture:
    '@type': mixture
    components/:
      '{i}/':
        probability: Data, dimensionless  # Nonnegative, sums to one at each incident energy
        distribution: Distribution  # All components sample the same physical quantities

  isotropic:
    '@type': isotropic

  tabulated:
    '@type': tabulated
    value: float [K]  # Sample coordinates in the containing field's units
    pdf: float [K]  # Inverse sample-coordinate units
    interpolation: Interpolation

  incident-energy-dependent:
    '@type': incident-energy-dependent
    energy: float [I], eV
    interpolation: Interpolation  # Histogram or linear only
    distributions/:
      '{i}': Distribution  # One per incident-energy point

  level-scattering:
    '@type': level-scattering
    C1: float, eV
    C2: float, dimensionless

  maxwellian:
    '@type': maxwellian
    temperature: Data, eV  # Spectral temperature, not kelvin
    restriction-energy: float, eV

  evaporation:
    '@type': evaporation
    temperature: Data, eV  # Spectral temperature, not kelvin
    restriction-energy: float, eV

  kalbach-mann:
    '@type': kalbach-mann
    energy: float [I], eV
    tables/:
      '{i}/':
        outgoing-energy: Distribution, eV  # Tabulated only
        precompound-factor: Data, dimensionless  # Input is outgoing energy in eV
        angular-slope: Data, dimensionless  # Input is outgoing energy in eV

  energy-angle-tabulated:
    '@type': energy-angle-tabulated
    energy: float [I], eV
    tables/:
      '{i}/':
        outgoing-energy: Distribution, eV  # Tabulated only
        cosine-distributions/:
          '{j}': Distribution, cosine  # Tabulated only; one per outgoing-energy point

  n-body:
    '@type': n-body
    value: float [K], eV
    pdf: float [K], 1/eV
    interpolation: Interpolation

# ======================================================================================
# Interpolation
# ======================================================================================

Interpolation:
  laws: string [R]  # histogram, linear, semilog-x, semilog-y, or log
  boundaries: integer [R]  # Zero-based upper point index of each region

# ======================================================================================
# Notes
# ======================================================================================

notes:
  - File layouts and reusable type definitions are separate; a type reference expands to its selected representation at that field.
  - Each reaction lists its fields explicitly; cross-products is a basic field and an empty group when no cross-species products are specified.
  - Repeated entries represent independent records; matching indices across related arrays or groups must refer to the same record.
  - Atomic-relaxation shell designators link vacancies to transition tables; the block is shared element data, independent of which projectile created the vacancy.
  - Shell-averaged cross-products, conditional subshell cross-products and relaxation transitions must not duplicate the same emitted contribution.
  - Momentum-transfer coordinates for form factors and scattering functions must use the same definition as their source tables; units alone do not define that coordinate.
  - An omitted optional field indicates unspecified data, not an implicit zero value or default representation.
